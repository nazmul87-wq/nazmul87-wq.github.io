<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog · Md Nazmul Islam</title>
    <meta name="description" content="Short notes on robotics and medical devices, from the lab and the field." />
    <link rel="canonical" href="https://nazmulislam-lab.github.io/blog/" />
    <link rel="alternate" type="application/rss+xml" title="Md Nazmul Islam" href="../feed.xml" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="../assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../assets/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../css/styles.css" />
    <script>
      document.documentElement.classList.add("js");
      (function () {
        try {
          var saved = localStorage.getItem("nazmul-theme");
          var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body data-blog="index">
    <header class="site-header">
      <a class="wordmark" href="../index.html">
        <span class="mark" aria-hidden="true">NI</span>
        <span>Nazmul</span>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" data-nav>
        <a href="../index.html#about">About</a>
        <a href="../index.html#publications">Publications</a>
        <a href="../index.html#experience">Experience</a>
        <a href="../index.html#projects">Projects</a>
        <a href="index.html" aria-current="page">Blog</a>
        <a href="../index.html#contact">Contact</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode"></button>
    </header>
    <main id="main" class="section blog-main">
      <div class="section-head section-head-split">
        <div>
          <p class="kicker">Blog</p>
          <h1>Notes</h1>
        </div>
        <a class="button button-ghost" data-icon="rss" href="../feed.xml">RSS</a>
      </div>
      <p class="lede">Short notes on robotics and medical devices, from the lab and the field.</p>
      <div class="post-filters" data-blog-filters role="group" aria-label="Filter by category">
        <button type="button" data-category="all" aria-pressed="true">All</button>
        <button type="button" data-category="News" aria-pressed="false">News</button>
        <button type="button" data-category="Posts" aria-pressed="false">Posts</button>
      </div>
      <p class="status" data-blog-status role="status">Loading posts…</p>
      <p class="post-empty" data-blog-empty hidden>No posts in this category.</p>
      <div class="post-list" data-blog-list></div>
    </main>
    <footer class="site-footer">
      <div class="footer-copy">
        <p>© <span data-year>2026</span> Md Nazmul Islam</p>
      </div>
      <nav class="footer-social" data-footer-social aria-label="Social profiles"></nav>
    </footer>
    <script type="module" src="../js/blog.js"></script>
  </body>
</html>
